[package]
name = "rng-grid"
default-run = "rng-grid"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "6x6 RNG: 8192 fixed outcome types, uniform independent sampling with replacement, 96.5% theoretical RTP"
publish = false

[dependencies]
rand = { version = "=0.10.3", features = ["unbiased"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
naga = { version = "=30.0.1", features = ["wgsl-in"], optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:naga"]

[profile.release]
lto = "thin"
codegen-units = 1
