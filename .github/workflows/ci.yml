name: Rust RNG 6x6 - 128 tipos / paquetes de 100

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust tests, Clippy and end-to-end packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust stable and Clippy
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - name: Run unit tests
        run: cargo test --all-targets
      - name: Check Clippy without warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: Generate 7 batches of 100 in compact mode and split files
        shell: bash
        run: |
          cargo run --release -- --packages 7 --out smoke --compact --split-files
      - name: Verify all 128 patterns and 700 bets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          folder = Path("smoke")
          catalog = json.loads((folder / "catalogo_128.json").read_text())
          outcomes = catalog["outcomes"]
          assert len(outcomes) == 128
          assert len({tuple(sum(item["grid"], [])) for item in outcomes}) == 128
          assert all(len(grid) == 6 and all(len(row) == 6 for row in grid) for grid in (x["grid"] for x in outcomes))
          assert sum(o["payout_bps"] for o in outcomes) == 128 * 9650
          assert dict(Counter(x["payout_bps"] for x in outcomes)) == {
              0: 64, 10000: 32, 15000: 16, 20000: 8,
              35200: 1, 40000: 4, 80000: 2, 160000: 1
          }
          packages = [json.loads(line) for line in (folder / "paquetes.jsonl").read_text().splitlines()]
          assert len(packages) == 7
          for i, package in enumerate(packages, 1):
              ids = package["outcome_ids"]
              assert package["package"] == i
              assert len(ids) == len(set(ids)) == 100
              assert all(1 <= item <= 128 for item in ids)
              expected = sum(outcomes[item-1]["payout_bps"] for item in ids)
              assert package["total_payout_bps"] == expected
              assert (folder / "paquetes" / f"paquete_{i:06}.json").exists()
          assert len((folder / "resumen_paquetes.csv").read_text().splitlines()) == 8
          assert len((folder / "catalogo_128.csv").read_text().splitlines()) == 129
          print("OK: 128 unique types and seven validated packages of 100.")
          PY
      - name: Test reuse and embedded full matrices
        shell: bash
        run: |
          cargo run --release -- --packages 3 --reuse-catalog smoke/catalogo_128.json --out full
          python3 - <<'PY'
          import json
          from pathlib import Path
          original = json.loads(Path("smoke/catalogo_128.json").read_text())
          reused = json.loads(Path("full/catalogo_128.json").read_text())
          assert original == reused
          packages = [json.loads(line) for line in Path("full/paquetes.jsonl").read_text().splitlines()]
          assert len(packages) == 3
          for package in packages:
              assert len(package["bets"]) == 100
              assert len({x["id"] for x in package["bets"]}) == 100
              assert sum(x["payout_bps"] for x in package["bets"]) == package["total_payout_bps"]
          print("OK: unchanged catalog, embedded 6x6 matrices and exactly 100 bets.")
          PY

      - name: Audit security: secure shuffling vs independent draws vs weak control
        shell: bash
        run: |
          cargo run --release --bin rng_redteam -- --packages 256 --mode all --catalog smoke/catalogo_128.json --out redteam
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("redteam/auditoria.json").read_text())
          runs = report["runs"]
          assert len(runs) == 3
          without, independent, weak = runs
          assert without["mode"] == "without_replacement"
          assert without["structural_exploit_detected"] is True
          assert without["duplicates_within_packages"] == 0
          assert without["checkpoints"][-1]["possible_next_types"] == 29
          assert independent["mode"] == "with_replacement"
          assert independent["structural_exploit_detected"] is False
          assert independent["checkpoints"][-1]["possible_next_types"] == 128
          assert all(x["conditional_positive_ev_opportunities"] == 0 for x in independent["checkpoints"])
          assert weak["mode"] == "weak_counter" and weak["weak_rng_predictable"] is True
          assert weak["checkpoints"][-1]["increment_predictor_success_percent"] == 100
          assert len(Path("redteam/predicciones.csv").read_text().splitlines()) == 19
          print("RNG ATTACK SUITE OK: structural leak detected; iid reference and weak canary validated.")
          PY

  windows-portable:
    name: Build GUI+CLI for Windows x64 and test startup
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
      - name: Run tests
        run: cargo test --all-targets
      - name: Compile release binaries
        run: cargo build --release
      - name: Smoke-test Windows package generation
        shell: pwsh
        run: |
          .\target\release\rng-grid.exe --packages 3 --out smoke --compact
          if ($LASTEXITCODE -ne 0) { throw "Rust CLI failed" }
          $catalog = Get-Content .\smoke\catalogo_128.json -Raw | ConvertFrom-Json
          if ($catalog.outcomes.Count -ne 128) { throw "Expected 128 outcomes" }
          $packages = @(Get-Content .\smoke\paquetes.jsonl | ForEach-Object { $_ | ConvertFrom-Json })
          if ($packages.Count -ne 3) { throw "Expected 3 packages" }
          foreach ($package in $packages) {
            if ($package.outcome_ids.Count -ne 100) { throw "Package has a count different from 100" }
            if (@($package.outcome_ids | Select-Object -Unique).Count -ne 100) { throw "Repeated ID in same batch" }
          }
      - name: Clippy for native Windows GUI
        run: cargo clippy --all-targets -- -D warnings
      - name: Build GPU-enabled auditor (wgpu 30 for AMD/NVIDIA)
        run: cargo build --release --features gpu --bin rng_redteam
      - name: Clippy for GPU feature
        run: cargo clippy --features gpu --bin rng_redteam -- -D warnings
      - name: E2E adversarial audit on Windows using GPU-capable executable in CPU mode
        shell: pwsh
        run: |
          .\target\release\rng_redteam.exe --packages 64 --mode all --catalog smoke\catalogo_128.json --out audit_smoke
          if ($LASTEXITCODE -ne 0) { throw "RNG auditor test failed" }
          $result = Get-Content .\audit_smoke\auditoria.json -Raw | ConvertFrom-Json
          if ($result.runs.Count -ne 3) { throw "Expected three audit models" }
          if (-not $result.runs[0].structural_exploit_detected) { throw "Structural leak not detected" }
          if (-not $result.runs[2].weak_rng_predictable) { throw "Predictor failed to detect intentionally weak RNG" }
      - name: Validate actual native GUI startup and generate button path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\windows_gui.exe dist\RNG-6x6.exe
          Copy-Item target\release\rng-grid.exe dist\RNG-6x6-CLI.exe
          $gui = Start-Process -FilePath (Resolve-Path .\dist\RNG-6x6.exe).Path -ArgumentList '--self-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP 'rng-gui-self-test-error.txt'
            if (Test-Path $log) { Get-Content $log }
            throw "Native Rust GUI E2E test failed"
          }
          Write-Output "OK: native GUI controls and complete generation of 3 packages of 100"
      - name: Build Windows distributable ZIP folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item INICIAR-WINDOWS.cmd dist\INICIAR-WINDOWS.cmd
          Copy-Item DIAGNOSTICO-WINDOWS.cmd dist\DIAGNOSTICO-WINDOWS.cmd
          Copy-Item README.md dist\README.md
          Copy-Item AUDITAR-RNG.cmd dist\AUDITAR-RNG.cmd
          Copy-Item target\release\rng_redteam.exe dist\RNG-6x6-AUDITOR.exe
          if ((Get-Item dist\RNG-6x6-AUDITOR.exe).Length -lt 1024) { throw "Invalid auditor executable" }
          if (Test-Path dist\RNG-6x6-GUI.ps1) { throw "PowerShell dependency must not be shipped" }
          if ((Get-Item dist\RNG-6x6.exe).Length -lt 1024) { throw "Invalid launcher" }
          if ((Get-Item dist\RNG-6x6-CLI.exe).Length -lt 1024) { throw "Invalid CLI binary" }
      - name: Publish Windows portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: RNG-6x6-Paquetes-Windows-x64
          path: dist/
          retention-days: 30
          if-no-files-found: error
