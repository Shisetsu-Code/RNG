name: Rust RNG CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests, lint and 128-wallet smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust stable and Clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Verify 128 unique-wallet CSV
        run: |
          cargo run --release -- --spins 100 --summary-only --csv report.csv
          test "$(wc -l < report.csv)" -eq 129
