name: Rust RNG CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests, lint and interactive smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust stable and Clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Verify 128 unique-wallet CSV with total bets
        run: |
          cargo run --release -- --total-spins 257 --summary-only --csv report.csv
          test "$(wc -l < report.csv)" -eq 129
          test "$(awk -F, 'NR>1 {n+=$4} END {print n}' report.csv)" -eq 257
      - name: Verify interactive prompts through standard input
        run: |
          printf '257\n1\n48\n1000000\n10000\nn\n' | cargo run --release -- > interactive.log
          grep -q 'Apuestas realizadas: 257' interactive.log

  windows-portable:
    name: Build and test Windows portable .exe (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
      - name: Test project
        run: cargo test --all-targets
      - name: Compile release executable
        run: cargo build --release
      - name: Smoke test 128 balances and 257 total bets
        shell: pwsh
        run: |
          .\target\release\rng-grid.exe --total-spins 257 --summary-only --csv report.csv
          $rows = @(Import-Csv .\report.csv)
          if ($rows.Count -ne 128) { throw "Expected 128 wallets, got $($rows.Count)" }
          $count = ($rows | Measure-Object -Property spins -Sum).Sum
          if ($count -ne 257) { throw "Expected 257 bets, got $count" }
      - name: Validate Windows GUI script and initialize Windows Forms
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\RNG-6x6-GUI.ps1).Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "Invalid PowerShell syntax"
          }
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\RNG-6x6-GUI.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'GUI_SELF_TEST_OK') {
            throw "GUI self-test failed: $output"
          }
          $env:RNG_GUI_TEST_FORM = '1'
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'rng-gui-form-stdout.txt'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'rng-gui-form-stderr.txt'
          $proc = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-STA', '-File', '.\RNG-6x6-GUI.ps1') -WorkingDirectory $PWD.Path -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru
          if (-not $proc.WaitForExit(12000)) {
            $proc.Kill()
            $startupLog = Join-Path $env:TEMP 'RNG-GUI-startup.log'
            $markers = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '(no startup log)' }
            $stderr = if (Test-Path $stderrPath) { Get-Content $stderrPath -Raw } else { '(no stderr)' }
            throw "GUI control-construction test timed out after markers: $markers / Errors: $stderr"
          }
          $formOutput = Get-Content $stdoutPath -Raw
          $formErrors = Get-Content $stderrPath -Raw
          if ($proc.ExitCode -ne 0 -or $formOutput -notmatch 'GUI_FORM_CREATED_OK') {
            throw "GUI control-construction test failed: $formOutput $formErrors"
          }
      - name: Prepare portable Windows folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\rng-grid.exe dist\RNG-6x6-CLI.exe
          Copy-Item target\release\windows_gui.exe dist\RNG-6x6.exe
          Copy-Item RNG-6x6-GUI.ps1 dist\RNG-6x6-GUI.ps1
          Copy-Item INICIAR-WINDOWS.cmd dist\INICIAR-WINDOWS.cmd
          Copy-Item DIAGNOSTICO-WINDOWS.cmd dist\DIAGNOSTICO-WINDOWS.cmd
          Copy-Item README.md dist\README.md
          if ((Get-Item dist\RNG-6x6.exe).Length -lt 1024) { throw "Invalid GUI executable" }
          if ((Get-Item dist\RNG-6x6-CLI.exe).Length -lt 1024) { throw "Invalid CLI executable" }
      - name: Publish Windows executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: RNG-6x6-Windows-GUI-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
